<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>BenchLab — local inference telemetry</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c0f'/%3E%3Cpath d='M6 22 L13 12 L18 18 L26 8' stroke='%23a6ff3f' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <path d="M4 24 L12 12 L18 19 L28 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="28" cy="6" r="2.4" fill="currentColor"/>
        </svg>
      </span>
      <div class="brand-text">
        <strong>BENCH<span>LAB</span></strong>
        <small>local inference telemetry</small>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-view="run">Run detail</button>
      <button class="tab" data-view="compare">Compare machines</button>
    </nav>

    <div class="topbar-right">
      <span class="status" id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
      <button class="ghost-btn" id="refresh" title="Reload reports">↻</button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="label">Runs</span>
        <span class="count" id="run-count">—</span>
      </div>
      <div class="run-list" id="run-list"></div>
    </aside>

    <main class="stage" id="stage">
      <section class="view view-run is-active" id="view-run" aria-label="Run detail"></section>
      <section class="view view-compare" id="view-compare" aria-label="Machine comparison"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
